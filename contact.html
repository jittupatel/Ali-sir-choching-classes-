    * {

    body {
      font-family: Arial;
      background: #eef2ff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b3d91;
      color: white;
      padding: 12px 18px;
    }
    
    .logo img {

      height: 45px;

    .title {

      font-weight: bold;
    }
    
    .menu {
      font-size: 28px;
      cursor: pointer;
    }
    
    .sidebar {
      position: fixed;
      top: 0;
      right: -260px;
      width: 260px;
      height: 100%;
      background: #0b3d91;
      transition: .3s;
      padding-top: 60px;
      z-index: 1000;
    }
    
    .sidebar a {
      display: block;
      color: white;
      padding: 15px;
      text-decoration: none;
      font-size: 18px;
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .4);
      display: none;
      z-index: 999;
    }
    
    main {
      flex: 1;
      padding: 40px;
    }
    
    .contact-card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .1);
    }
    
    .contact-card h2 {
      margin-bottom: 10px;
    }
    
    .contact-card p {
      margin-bottom: 8px;
    }
    
    form {
      margin-top: 20px;
    }
    
    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    
    button {
      padding: 12px 20px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 20px;
    }
    
    
    footer {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 15px;
    }
    
    footer>a {
      margin-top: 5px;
      padding-top: 10px;
      text-decoration: none;
      color: #e1f1ff;
